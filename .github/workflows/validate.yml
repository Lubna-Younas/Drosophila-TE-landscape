name: Validate source and documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax, provenance, metadata, and publication hygiene
        run: python3 scripts/validate_repository.py
      - name: Run existing small synthetic checks without HPC tools
        run: python3 scripts/run_synthetic_checks.py
